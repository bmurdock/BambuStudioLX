name: Build all

on:
  push:
    branches:
     - master
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'bbl/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"

  pull_request:
    branches:
     - master
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'BuildLinux.sh'
     - 'build_win.bat'
    
  workflow_dispatch: # manual dispatch
      inputs:
        build-deps-only:
            description: 'Only build dependencies (bypasses caching)'
            type: boolean
            default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_all:
    name: Build All
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: ubuntu-26.04
          - os: windows-latest
          - os: windows-11-arm
            arch: arm64
          - os: windows-11-arm
            arch: arm64ec
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: macos-26
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  attest_build:
    name: Attest BambuStudio artifacts
    needs: build_all
    if: ${{ needs.build_all.result == 'success' && inputs.build-deps-only != true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download produced BambuStudio artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: BambuStudio_*
          path: attestation-subjects
          merge-multiple: true

      - name: Attest produced build artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            ${{ github.workspace }}/attestation-subjects/BambuStudio_Windows_*.zip
            ${{ github.workspace }}/attestation-subjects/BambuStudio_Mac_*.zip
            ${{ github.workspace }}/attestation-subjects/Bambu_Studio_ubuntu-*.AppImage
