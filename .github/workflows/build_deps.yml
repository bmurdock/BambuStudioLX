on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: setup dev on Windows
        if: startsWith(inputs.os, 'windows')
        uses: microsoft/setup-msbuild@v2

      - name: Install NASM on Windows
        if: startsWith(inputs.os, 'windows')
        shell: pwsh
        run: |
          choco install nasm --version=3.2.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM installation failed: $LASTEXITCODE" }
          $nasmDir = Join-Path $env:ProgramFiles 'NASM'
          Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
          $env:Path = "$nasmDir;$env:Path"
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw "NASM verification failed: $LASTEXITCODE" }

      - name: Get the date on Ubuntu and macOS
        if: ${{ !startsWith(inputs.os, 'windows') }}
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the date on Windows
        if: startsWith(inputs.os, 'windows')
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        shell: pwsh


      # Build Dependencies
      - name: Build on Windows
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: |
            choco install strawberryperl
            choco install pkgconfiglite
            mkdir ${{ github.workspace }}\deps\build
            mkdir ${{ github.workspace }}\deps\build\BambuStudio_dep
            cd "${{ github.workspace }}\deps\build"
            cmake ../ -G "Visual Studio 18 2026" -A x64 -DDESTDIR="./BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
            msbuild /m ALL_BUILD.vcxproj

      - name: pack deps on Windows
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: Compress-Archive -Path "${{ github.workspace }}\deps\build\BambuStudio_dep\*" -DestinationPath "${{ github.workspace }}\deps\build\BambuStudio_dep_win64_${{ env.date }}_vs2022.zip"
        shell: pwsh

      # Windows on ARM64/ARM64EC. The windows-11-arm runner ships Visual
      # Studio 2026, as does the x64 runner. Per-dep arch handling is selected
      # automatically from the -A platform (arm64ec = native ARM64 code with
      # the x64-compatible ABI, which is what lets the app load the x64-only
      # Bambu network plugin in-process).
      - name: Build on Windows ARM64/ARM64EC
        if: inputs.os == 'windows-11-arm'
        working-directory: ${{ github.workspace }}
        run: |
            choco install strawberryperl
            choco install pkgconfiglite
            mkdir ${{ github.workspace }}\deps\build
            mkdir ${{ github.workspace }}\deps\build\BambuStudio_dep
            cd "${{ github.workspace }}\deps\build"
            $platform = "${{ inputs.arch }}" -eq "arm64ec" ? "ARM64EC" : "ARM64"
            cmake ../ -G "Visual Studio 18 2026" -A $platform -DDESTDIR="./BambuStudio_dep" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF
            msbuild /m ALL_BUILD.vcxproj
        shell: pwsh

      - name: pack deps on Windows ARM64/ARM64EC
        if: inputs.os == 'windows-11-arm'
        working-directory: ${{ github.workspace }}
        run: Compress-Archive -Path "${{ github.workspace }}\deps\build\BambuStudio_dep\*" -DestinationPath "${{ github.workspace }}\deps\build\BambuStudio_dep_win-${{ inputs.arch }}_${{ env.date }}_vs2022.zip"
        shell: pwsh
          
      - name: Fix python install error on mac
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          find /usr/local/bin -lname '*/Library/Frameworks/Python.framework/*' -delete
          sudo rm -rf /Library/Frameworks/Python.framework/
          brew install --force python3 && brew unlink python3 && brew unlink python3 && brew link --overwrite python3
      
      - name: Free disk space
        if: inputs.os == 'macos-15'
        run: |
          df -h
          active_xcode="$(cd "${DEVELOPER_DIR:-$(xcode-select -p)}" && pwd -P)"
          while [[ "$active_xcode" != / && "$active_xcode" != *.app ]]; do
            active_xcode="$(dirname "$active_xcode")"
          done
          if [[ "$active_xcode" == *.app ]]; then
            sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -path "$active_xcode" -exec rm -rf {} +
          fi
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -h

      # Keep zstd installed: Homebrew's curl downloader links to libzstd.
      # The bundled curl already disables zstd in deps/CURL/CURL.cmake.
      - name: Build on Mac ${{ inputs.arch }}
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            brew unlink cmake || true
            brew tap-new $USER/old-cmake
            brew tap --force homebrew/core
            brew extract --version=3.31.0 cmake $USER/old-cmake
            brew install $USER/old-cmake/cmake@3.31.0
            brew link --overwrite cmake@3.31.0
            brew pin cmake@3.31.0
            ./BuildMac.sh -d -x -a x86_64 -t 10.15 -1
            for arch in x86_64; do
                (cd "${{ github.workspace }}/deps/build/${arch}" && \
                find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            done
      
      - name: Build on Mac ${{ inputs.arch }}
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo nasm yasm x264
            brew unlink cmake || true
            brew tap-new $USER/old-cmake
            brew tap --force homebrew/core
            brew extract --version=3.31.0 cmake $USER/old-cmake
            brew install $USER/old-cmake/cmake@3.31.0
            brew link --overwrite cmake@3.31.0
            brew pin cmake@3.31.0
            ./BuildMac.sh -d -x -a universal -t 10.15 -1
            for arch in arm64 x86_64; do
                (cd "${{ github.workspace }}/deps/build/${arch}" && \
                find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
            done

      - name: pack deps on Macos
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}/deps
          tar -zcvf "BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}_$(date +"%Y%m%d").tar.gz" build


      - name: Build on Ubuntu
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        working-directory: ${{ github.workspace }}
        run: |
            sudo ./BuildLinux.sh -ur
            sudo chown $USER -R ./
            ./BuildLinux.sh -dfr
            cd deps/build
            tar -czvf BambuStudio_dep_${{ inputs.os }}_$(date +"%Y%m%d").tar.gz destdir

      # Upload Artifacts
      - name: Upload Mac ${{ inputs.arch }} artifacts
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}_*.tar.gz

      - name: clean artifacts
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: rm -rf ${{ github.workspace }}/deps/BambuStudio_dep_${{ inputs.os }}_${{ inputs.arch }}_*.tar.gz

      - name: Upload Windows artifacts
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_win64_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep*.zip

      - name: Upload Windows ARM64/ARM64EC artifacts
        if: inputs.os == 'windows-11-arm'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_win-${{ inputs.arch }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep*.zip

      - name: Upload Ubuntu artifacts
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') }}
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_dep_${{ inputs.os }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/BambuStudio_dep_${{ inputs.os }}_*.tar.gz

  build_Bambu:
    name: Build BambuStudio
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_bambu.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit
